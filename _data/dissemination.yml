- date: 2026-10-21
  type: Workshop
  organised: true
  title: WorKnow meets Maxine Berg
  place: Scuola Superiore Sant’Anna, Pisa
  when: Room 6, 10:30–13:30
  text: A morning in which the WorKnow team presented its research to the economic historian Maxine Berg.
  programme:
    - speaker: Jip van Besouw
      title: "Money problems: Struggling with value, coins, and precision in late medieval and early modern Europe"
    - speaker: Raffaele Danna
      title: "Reading between the numbers: What we can learn from the uses of numerals in European accounts (14th–17th centuries)"
    - speaker: Giuliana Freschi
      title: "Women in the making of practical knowledge: Midwifery manuals in Europe, 1600–1800"
    - speaker: Francesca Masiero
      title: "Straddling the learned/practical divide: the uses of mathematics in the 15th-century Venetian state"
    - speaker: Andrea Papi
      title: "State capacity in miniature: A late medieval case of state-building and engineering expertise"
  flyer: /assets/docs/2026-10-21-worknow-meets-maxine-berg.pdf
  thumb: /assets/img/flyers/2026-10-21-worknow-meets-maxine-berg.jpg

