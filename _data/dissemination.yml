# Dissemination: workshops and events organised by WorKnow, and presentations
# where the team presents the project's work. One list for everything.
# Order doesn't matter: the page shows the newest first and marks upcoming items automatically.
#
#   date:       YYYY-MM-DD
#   end_date:   optional, for items lasting more than one day
#   type:       Workshop, Conference paper, Seminar, Invited talk, Public lecture…
#   organised:  true if WorKnow organised it (shows "Organised by WorKnow")
#   title:      Title of the event, or of the paper presented
#   speakers:   optional, who presented (for talks and papers)
#   place:      Venue or conference, city
#   when:       optional, room and time, e.g. "Room 6, 10:30–13:30"
#   text:       optional short description
#   programme:  optional list of talks, each with "speaker" and "title"
#   flyer:      optional PDF uploaded to assets/docs/
#   thumb:      optional picture of the flyer uploaded to assets/img/flyers/ (about 300 px wide)
#   link:       optional link to an external page (conference website, slides…)

