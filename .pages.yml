# Pages CMS configuration (optional).
# Lets the team edit content through web forms at https://app.pagescms.org
# instead of editing files by hand. Each save is an ordinary GitHub commit,
# so the site rebuilds exactly as if the file had been edited on GitHub.

media:
  input: assets
  output: /assets
  categories: [image, document]

content:
  - name: dissemination
    label: Dissemination
    type: file
    path: _data/dissemination.yml
    format: yaml
    list: true
    fields:
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: end_date
        label: End date (multi-day events only)
        type: date
        options:
          format: yyyy-MM-dd
      - name: type
        label: Type (Workshop, Conference, Seminar, Conference paper, Invited talk…)
        type: string
      - name: organised
        label: Organised by WorKnow
        type: boolean
      - name: title
        label: Title of the event or of the paper presented
        type: string
        required: true
      - name: speakers
        label: Speakers (for talks and papers)
        type: string
      - name: place
        label: Venue or conference, city
        type: string
      - name: when
        label: Room and time (e.g. Room 6, 10:30–13:30)
        type: string
      - name: text
        label: Short description
        type: text
      - name: programme
        label: Programme (talks)
        type: object
        list: true
        fields:
          - name: speaker
            label: Speaker
            type: string
          - name: title
            label: Title of the talk
            type: string
      - name: flyer
        label: Flyer (PDF)
        type: file
      - name: thumb
        label: Picture of the flyer (about 300 px wide)
        type: image
      - name: link
        label: Link to an external page (conference website, slides…)
        type: string

  - name: team
    label: Team
    type: file
    path: _data/team.yml
    format: yaml
    list: true
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role (Principal Investigator or Researcher)
        type: string
      - name: specialisation
        label: Specialisation (short line)
        type: string
      - name: photo
        label: Portrait (square or 4:5)
        type: image
      - name: email
        label: Email
        type: string
      - name: link
        label: Personal or institutional page (shown as people/Name-Surname)
        type: string

  - name: collaborators
    label: Collaborators
    type: file
    path: _data/collaborators.yml
    format: yaml
    list: true
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role (e.g. Advisory board)
        type: string
      - name: affiliation
        label: Institution
        type: string
      - name: photo
        label: Portrait
        type: image
      - name: link
        label: Web page
        type: string

  - name: publications
    label: Publications
    type: file
    path: _data/publications.yml
    format: yaml
    list: true
    fields:
      - name: type
        label: Type (Article, Working paper, Book chapter, Book, Dataset…)
        type: string
        required: true
      - name: year
        label: Year
        type: number
        required: true
      - name: authors
        label: Authors (Surname, Name, and Name Surname)
        type: string
        required: true
      - name: title
        label: Title (no final full stop)
        type: string
        required: true
      - name: in
        label: Where it appeared (use *asterisks* for italics)
        type: string
      - name: doi
        label: DOI (e.g. 10.57617/gal-125)
        type: string
      - name: url
        label: Link to the article page
        type: string
      - name: pdf
        label: Direct link to the PDF
        type: string
      - name: oa
        label: Open access
        type: boolean

  - name: project
    label: Project description
    type: file
    path: project.md
    format: yaml-frontmatter
    fields:
      - name: layout
        type: string
        hidden: true
      - name: title
        type: string
        hidden: true
      - name: heading
        label: Heading
        type: string
      - name: subtitle
        label: Subtitle
        type: string
      - name: permalink
        type: string
        hidden: true
      - name: description
        label: Summary for search engines
        type: text
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown
