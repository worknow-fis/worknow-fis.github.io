---
layout: default
---
<article class="page post">
  <header class="page-head">
    <p class="label"><a href="{{ '/news/' | relative_url }}">News</a> · <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="prose post-body">
    {{ content }}
  </div>
  <p><a class="more" href="{{ '/news/' | relative_url }}">← All news</a></p>
</article>
